<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى جنى 💚</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="background"></div>

    <main class="container">

        <div class="small-title">A SPECIAL GIFT FOR YOU</div>

        <div class="heart">
            <div class="heart-content">
                <span class="sparkle">✦</span>
                <h1>جنى</h1>
                <span class="heart-symbol">♡</span>
            </div>
        </div>

        <h2>إلى صديقتي الجميلة</h2>

        <div class="verse-box">
            <p class="verse">
                ﴿ سَنَشُدُّ عَضُدَكَ بِأَخِيكَ ﴾
            </p>
            <span class="reference">سورة القصص - الآية 35</span>
        </div>

        <p class="message">
            جنى، لعل أجمل ما في صداقتنا أنني لا أتمنى
            أن تكوني رفيقة أيامي فقط،
            بل أسأل الله أن يجمعني بكِ في جنته أيضًا.
        </p>

        <div class="decoration">✧ ۞ ✧</div>

        <p class="footer">
            أسأل الله أن يديم بيننا المودة والخير ♡
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
